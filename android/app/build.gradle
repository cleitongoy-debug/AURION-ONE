plugins { id 'com.android.application' }
android {
    namespace 'one.aurion.app'
    compileSdk 35
    defaultConfig {
        applicationId 'one.aurion.poco.v6'
        minSdk 26
        targetSdk 35
        versionCode 73
        versionName '7.1.0'
        manifestPlaceholders = [appLabel: 'AURION EU3 · MAESTRO']
    }
    buildTypes {
        debug {
            applicationIdSuffix '.preview.quickfix'
            versionNameSuffix '-preview'
            manifestPlaceholders = [appLabel: 'AURION ONE · LAB EU3']
        }
    }
}
dependencies {
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.work:work-runtime:2.9.1'
}
