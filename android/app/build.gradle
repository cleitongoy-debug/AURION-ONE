plugins { id 'com.android.application' }
android {
    namespace 'one.aurion.app'
    compileSdk 35
    defaultConfig {
        applicationId 'one.aurion.mobile'
        minSdk 26
        targetSdk 35
        versionCode 10
        versionName '1.0.0'
        manifestPlaceholders = [appLabel: 'AURION ONE NOVO']
    }
    buildTypes {
        debug {
            applicationIdSuffix '.t8i'
            manifestPlaceholders = [appLabel: 'AURION ONE · T8i']
        }
    }
}
