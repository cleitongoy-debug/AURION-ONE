name: AURION Cinema Agent Android APK
on:
  push:
    branches: [feature/aurion-c4d-agent-apk-20261014]
    paths:
      - 'mobile-c4d-agent/**'
      - '.github/workflows/aurion-c4d-agent-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'mobile-c4d-agent/**'
      - '.github/workflows/aurion-c4d-agent-apk.yml'
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: mobile-c4d-agent
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify package exists
        run: test -s mobile-c4d-agent/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish unsigned debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AURION-Cinema-Agent-debug-apk
          path: mobile-c4d-agent/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
