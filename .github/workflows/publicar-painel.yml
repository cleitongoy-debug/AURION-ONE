name: Publicar painel AURION ONE
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'mobile/**'
      - '.github/workflows/publicar-painel.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publicar:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar site sem instalar no celular
        run: |
          mkdir -p _site/mobile
          cp index.html _site/index.html
          cp mobile/aurion-one-live.html _site/mobile/aurion-one-live.html
      - name: Enviar site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@v4
