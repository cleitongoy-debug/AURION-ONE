name: Build AURION Mobile AI APK
on:
  pull_request:
    branches: [main]
    paths: ['aurion-mobile-ai/**', 'pc-package-v3/aurion_superstudio/**', 'pc-package-v3/requirements-t8i.txt', '.github/workflows/aurion-mobile-ai.yml']
  push:
    branches: [main, 'feat/**']
    paths: ['aurion-mobile-ai/**', '.github/workflows/aurion-mobile-ai.yml']
  workflow_dispatch:
permissions: { contents: read }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults: { run: { working-directory: aurion-mobile-ai } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Verify PC T8i bridge syntax
        run: python -m py_compile ../pc-package-v3/aurion_superstudio/app.py ../pc-package-v3/aurion_superstudio/services.py ../pc-package-v3/aurion_superstudio/store.py
      - name: Compile
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify and name
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/AURION-ONE-HUD-v3.0.0.apk
          sha256sum app/build/outputs/apk/debug/AURION-ONE-HUD-v3.0.0.apk > app/build/outputs/apk/debug/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: AURION-ONE-HUD-v3.0.0
          path: |
            aurion-mobile-ai/app/build/outputs/apk/debug/AURION-ONE-HUD-v3.0.0.apk
            aurion-mobile-ai/app/build/outputs/apk/debug/SHA256SUMS.txt
          retention-days: 30
