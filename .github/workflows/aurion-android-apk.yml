name: AURION ONE Super Studio APK
on:
  push:
    branches: [main, feat/dedicacao-certificados-20260928, deliver/poco-v69, deliver/poco-v70-profiles, feat/eu3-lab-factory-c4d-20261010]
    paths:
      - 'android/**'
      - 'pc-package-v3/aurion_superstudio/**'
      - 'pc-package-v3/requirements-t8i.txt'
      - '.github/workflows/aurion-android-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - 'pc-package-v3/aurion_superstudio/**'
      - 'pc-package-v3/requirements-t8i.txt'
      - '.github/workflows/aurion-android-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-superstudio-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Android platform and build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify T8i PC bridge syntax
        working-directory: .
        run: python -m py_compile pc-package-v3/aurion_superstudio/app.py pc-package-v3/aurion_superstudio/services.py pc-package-v3/aurion_superstudio/store.py
      - name: Verify WebView scripts
        run: for file in app/src/main/assets/*.js; do node --check "$file"; done
      - name: Compile Super Studio APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Compile unsigned release candidate for private signing
        run: gradle --no-daemon :app:assembleRelease
      - name: Name APK and checksum
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/AURION-ONE-POCO-v7.2.0-TESTE.apk
          sha256sum app/build/outputs/apk/debug/AURION-ONE-POCO-v7.2.0-TESTE.apk > app/build/outputs/apk/debug/SHA256SUMS.txt
      - name: Publish debug test package (not compatible with installed release)
        uses: actions/upload-artifact@v4
        with:
          name: AURION-ONE-POCO-v7.2.0-TESTE
          path: |
            android/app/build/outputs/apk/debug/AURION-ONE-POCO-v7.2.0-TESTE.apk
            android/app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish unsigned release candidate (requires original private key)
        uses: actions/upload-artifact@v4
        with:
          name: AURION-ONE-POCO-v7.2.0-ASSINAR-LOCALMENTE
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14

      - name: Copy signing tool for private post-build signing
        run: cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" app/build/outputs/apk/debug/apksigner.jar
      - name: Publish signing tool
        uses: actions/upload-artifact@v4
        with:
          name: aurion-signing-tool
          path: android/app/build/outputs/apk/debug/apksigner.jar
          if-no-files-found: error
          retention-days: 14
