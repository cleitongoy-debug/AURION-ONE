name: AURION ONE Super Studio APK
on:
  push:
    branches: [main, feat/mobile-superstudio-v5]
    paths:
      - 'android/**'
      - '.github/workflows/aurion-android-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/aurion-android-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-superstudio-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Android platform and build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile Super Studio APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Name APK and checksum
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/AURION-ONE-SUPER-STUDIO-v5.7.0-CHAT-VOICE.apk
          sha256sum app/build/outputs/apk/debug/AURION-ONE-SUPER-STUDIO-v5.7.0-CHAT-VOICE.apk > app/build/outputs/apk/debug/SHA256SUMS.txt
      - name: Publish installable package
        uses: actions/upload-artifact@v4
        with:
          name: AURION-ONE-SUPER-STUDIO-v5.7.0-CHAT-VOICE
          path: |
            android/app/build/outputs/apk/debug/AURION-ONE-SUPER-STUDIO-v5.7.0-CHAT-VOICE.apk
            android/app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
