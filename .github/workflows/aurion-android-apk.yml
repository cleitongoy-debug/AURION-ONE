name: AURION ONE V2 Super Studio APK
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/aurion-android-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/aurion-android-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-superstudio-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
        with: { packages: 'platform-tools' }
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Compile APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Name APK and checksum
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/AURION-ONE-V2-SUPER-STUDIO-v6.0.0.apk
          sha256sum app/build/outputs/apk/debug/AURION-ONE-V2-SUPER-STUDIO-v6.0.0.apk > app/build/outputs/apk/debug/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: AURION-ONE-V2-SUPER-STUDIO-v6.0.0
          path: |
            android/app/build/outputs/apk/debug/AURION-ONE-V2-SUPER-STUDIO-v6.0.0.apk
            android/app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
