name: AURION SPYDR Safe Recovery QA
on:
  push:
    branches:
      - feature/spydr-vigia-original-20261018
  pull_request:
    paths:
      - 'tools/spydr/**'
      - '.github/workflows/spydr-safe-recovery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-spydr:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile Python
        run: python -m compileall -q tools/spydr/SPYDR_VIGIA.py
      - name: Run SPYDR 10 safety and incremental tests
        run: python -m unittest discover -s tools/spydr/tests -p test_spydr_vigia.py -v
      - name: Parse PowerShell launcher without running it
        shell: powershell
        run: |
          $p='tools/spydr/REACENDER_SPYDR.ps1'
          $tokens=$null
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $p).Path,[ref]$tokens,[ref]$errors) | Out-Null
          if($errors.Count -gt 0){throw ($errors | Out-String)}
          Write-Host 'PowerShell launcher parsed OK'
