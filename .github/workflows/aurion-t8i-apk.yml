name: Build AURION T8i APK
on:
  push:
    branches: [ feature/aurion-t8i-mobile-v0-1 ]
    paths: [ 'aurion-t8i-android/**', '.github/workflows/aurion-t8i-apk.yml' ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aurion-t8i-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Unit sanity
        run: test -f app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AURION-T8i-Quantum-Photo-Studio-v0.1-debug
          path: aurion-t8i-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
