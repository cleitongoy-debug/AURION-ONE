name: LOVART panel isolated tests
on:
  pull_request:
    paths:
      - 'remote-agent/aurion_remote/lovart_catalog.py'
      - 'remote-agent/aurion_remote/app.py'
      - 'remote-agent/tests/test_lovart_catalog.py'
      - 'remote-agent/data/lovart_manifest.example.json'
      - '.github/workflows/lovart-panel-tests.yml'
  workflow_dispatch:
jobs:
  offline-validation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -e "./remote-agent[dev]"
      - name: Compile sources
        run: python -m py_compile remote-agent/aurion_remote/lovart_catalog.py remote-agent/aurion_remote/app.py remote-agent/tests/test_lovart_catalog.py
      - name: Test authenticated catalog without provider API
        working-directory: remote-agent
        run: python -m pytest -q tests/test_lovart_catalog.py tests/test_app.py
