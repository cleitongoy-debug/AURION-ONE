plugins { id 'com.android.application' }
android {
    namespace 'br.com.aurion.c4dagent'
    compileSdk 35
    defaultConfig {
        applicationId 'br.com.aurion.c4dagent.trilab'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1.0-tri-lab'
    }
    buildTypes {
        debug { debuggable true }
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
